on:
  workflow_call:
    inputs:
      registry:
        required: true
        description: "Registry to use: gcp, aws or github"
        type: string
      workload_identity_provider:
        required: false
        type: string
      service_account:
        required: false
        type: string
      region:
        required: false
        type: string
        default: ""
        description: "Cloud region (gcp and aws; not used by github)"
      repository_name:
        required: true
        type: string
        description: "Artifact Registry repository, ECR namespace or ghcr.io namespace (e.g. my-org/charts)"
      gcp_project_id:
        required: false
        type: string
      aws_role_arn:
        required: false
        type: string
        default: ""
        description: "AWS IAM role ARN for OIDC authentication (AWS only)"
      aws_account_id:
        required: false
        type: string
        default: ""
        description: "AWS Account ID for ECR registry (AWS only)"
      chart_path:
        required: false
        type: string
        default: "."
        description: "Directory holding Chart.yaml, relative to the repository root"
      app_version:
        required: false
        type: string
        default: ""
        description: "Sets appVersion in Chart.yaml when not empty"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 10
          fetch-tags: true
      - name: Lint
        env:
          CHART_PATH: ${{ inputs.chart_path }}
        run: |
          helm lint "${CHART_PATH}"
      - name: Tag
        uses: martoc/action-tag@v0
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}
        if: ${{ inputs.registry == 'gcp' }}
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.region }}
        if: ${{ inputs.registry == 'aws' }}
      - name: Helm Chart Build
        uses: martoc/action-helm-build@v0
        with:
          registry: ${{ inputs.registry }}
          region: ${{ inputs.region }}
          repository_name: ${{ inputs.repository_name }}
          gcp_project_id: ${{ inputs.gcp_project_id }}
          aws_account_id: ${{ inputs.aws_account_id }}
          chart_path: ${{ inputs.chart_path }}
          app_version: ${{ inputs.app_version }}
      - name: Release on GitHub
        uses: martoc/action-release@v0
